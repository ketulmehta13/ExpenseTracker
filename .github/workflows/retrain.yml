# Weekly retraining of the categorizer from users' feedback (champion / challenger).
# Off until configured: set the repository variable ENABLE_RETRAINING=true and the secrets
# SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY (Settings > Secrets and variables > Actions).
# Only feedback from users who opted in is read. The job never deploys anything: it uploads the
# report, and the challenger model if it earned promotion, for a person to review.
name: Retrain categorizer

on:
  schedule:
    - cron: '0 3 * * 1'  # Mondays, 03:00 UTC
  workflow_dispatch:

jobs:
  retrain:
    if: ${{ vars.ENABLE_RETRAINING == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ml-service/requirements*.txt

      - run: pip install -r requirements.txt

      - name: Train the champion (the model every image ships)
        run: python -m training.train_categorizer --min-holdout-f1 0.80

      - name: Retrain with feedback and decide
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m training.retrain_categorizer --from-supabase --out-dir retrain-output

      - name: Upload the report (and the challenger, if promoted)
        uses: actions/upload-artifact@v4
        with:
          name: retrain-${{ github.run_number }}
          path: ml-service/retrain-output/
