name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# A newer push to the same branch makes the older run pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build production bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://dummy-test.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'dummy-anon-key' }}
        run: npm run build

  edge-functions:
    name: Edge Functions (type check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno check supabase/functions/*/index.ts

  ml-service:
    name: ML service (lint + tests + evaluation gates + Docker image)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ml-service/requirements*.txt

      - run: pip install -r requirements-dev.txt

      # The embedding models (bge-small for help search, gte-small for the copilot), downloaded
      # once and reused between runs
      - uses: actions/cache@v4
        with:
          path: ml-service/models/embeddings
          key: embeddings-bge-small-en-v1.5-gte-small

      # The OCR models (~32 MB) live in the rapidocr package folder: cache them by version
      - name: Find the OCR model folder
        id: ocr
        run: echo "dir=$(python -c 'import os, rapidocr; print(os.path.join(os.path.dirname(rapidocr.__file__), "models"))')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.ocr.outputs.dir }}
          key: rapidocr-models-3.10.0

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest

      - name: Train categorizer (evaluation gate)
        run: python -m training.train_categorizer --min-holdout-f1 0.80

      - name: Evaluate insight detectors (evaluation gate)
        run: python -m training.evaluate_insights --gate

      - name: Evaluate quick-add parser (evaluation gate)
        run: python -m training.evaluate_quickadd --gate

      - name: Evaluate help-center retrieval (evaluation gate)
        run: python -m training.evaluate_rag --gate

      - name: Evaluate copilot knowledge retrieval (evaluation gate)
        run: python -m training.evaluate_copilot_retrieval --gate

      - name: Evaluate assistant understanding (evaluation gate)
        run: python -m training.evaluate_assistant --gate

      - name: Evaluate bill parsing (evaluation gate)
        run: python -m training.evaluate_receipts --gate

      - name: Evaluate bill scanning end to end on rendered photos (evaluation gate)
        run: python -m training.evaluate_receipt_ocr --gate

      - name: Upload model reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-reports
          path: ml-service/reports/
          if-no-files-found: ignore

      - name: Docker image builds
        run: docker build -t expense-ml-service .

  migrations:
    name: Supabase migrations (structure + PGlite tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every migration keeps row level security in mind
        run: |
          for file in supabase/migrations/*.sql; do
            echo "Checking $file..."
            test -s "$file"
            grep -q "ROW LEVEL SECURITY" "$file" || (echo "Missing RLS in $file" && exit 1)
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: supabase/tests/package-lock.json

      - name: Replay migrations on fresh and legacy databases
        working-directory: supabase/tests
        run: |
          npm ci
          npm test
