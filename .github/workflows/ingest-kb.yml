# Ingest ml-service/knowledge/ into the copilot's knowledge base (Supabase pgvector) when the
# knowledge files change on main, or by hand. Incremental: unchanged documents are skipped.
# Needs two repository secrets: SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY. The service-role
# key is used only here, never by the web service or the browser.
name: Ingest knowledge base

on:
  push:
    branches: [main]
    paths: ["ml-service/knowledge/**", "ml-service/app/rag/chunking.py", "ml-service/app/rag/documents.py"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report changes without writing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ingest-kb
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ml-service
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the secrets are set
        id: secrets
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::notice::SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY secrets are not set; skipping ingestion."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ml-service/requirements.txt
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ml-service/models/embeddings
          key: embeddings-bge-small-en-v1.5-gte-small
      - name: Ingest
        if: steps.secrets.outputs.ready == 'true'
        run: python -m training.ingest_kb ${{ inputs.dry_run && '--dry-run' || '' }}
