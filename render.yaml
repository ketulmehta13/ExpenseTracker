# Render Blueprint: deploys the ML service (ml-service/Dockerfile) as a web service.
# One click: https://render.com/deploy?repo=https://github.com/ketulmehta13/ExpenseTracker
# (or New > Blueprint in the Render dashboard), then fill in the two Supabase values it asks
# for. See docs/ai-ml/09-mlops.md for the full steps.
#
# The free plan has 512 MB of memory. The service needs about 200 MB, but the help-center
# embedding model adds about 370 MB, so on the free plan help search runs on keywords alone
# (EMBEDDING_MODEL is none). With 1 GB or more, delete that entry for hybrid search.
# Free services also sleep after 15 minutes without traffic; the first request then takes
# about a minute, which the app tolerates (ML features just don't show until it's awake).
services:
  - type: web
    name: expense-ml-service
    runtime: docker
    rootDir: ml-service
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://ketul-expense-tracker.vercel.app
      - key: EMBEDDING_MODEL
        value: none
      # The LLM: Groq's free tier through its OpenAI-compatible API (about 1 s per answer). Put the
      # key in the dashboard only; never commit it. LLM_PROVIDER=none switches every LLM feature off.
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_API_KEY
        sync: false
      - key: METRICS_TOKEN
        generateValue: true
