# Render Blueprint: deploys the ML service (ml-service/Dockerfile) as a web service.
# New > Blueprint in the Render dashboard, pick this repository, then fill in the two
# Supabase values it asks for. See docs/ai-ml/09-mlops.md for the full steps.
#
# The free plan has 512 MB of memory. The service needs about 200 MB, but the help-center
# embedding model adds about 370 MB, so on the free plan help search runs on keywords alone
# (EMBEDDING_MODEL is empty). With 1 GB or more, delete that line for hybrid search.
# Free services also sleep after 15 minutes without traffic; the first request then takes
# about a minute, which the app tolerates (ML features just don't show until it's awake).
services:
  - type: web
    name: expense-ml-service
    runtime: docker
    rootDir: ml-service
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://ketul-expense-tracker.vercel.app
      - key: EMBEDDING_MODEL
        value: ""
      - key: LLM_PROVIDER
        value: none
      - key: METRICS_TOKEN
        generateValue: true
