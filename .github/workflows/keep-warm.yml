# Render's free plan puts the ML service to sleep after 15 minutes without requests, and waking it
# takes about a minute: the assistant and bill scanning felt broken on the first try. A ping every
# 10 minutes keeps it awake. One always-on free service uses about 744 of the 750 free hours a month.
name: Keep ML service warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: curl --silent --show-error --max-time 120 --retry 2 https://expense-ml-service-nsuf.onrender.com/health
